<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nearby Places Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <rect width="40" height="40" rx="11" fill="#0F766E"/>
      <path d="M20 8c-5 0-9 3.9-9 8.8 0 6.4 9 14.2 9 14.2s9-7.800 9-14.200C29 11.900 25 8 20 8z" fill="#fff"/>
      <circle cx="20" cy="17" r="3.500" fill="#F59E0B"/>
    </svg>
    <div>
      <h1>Nearby Places Finder</h1>
      <p>PGs, food, hospitals, fuel and more around you, with real driving times.</p>
    </div>
  </header>

  <section class="controls" aria-label="Search controls">
    <div class="row">
      <form id="location-form" class="field grow" role="search">
        <label for="location-input">Your location</label>
        <div class="input-group">
          <input id="location-input" type="text" placeholder="Area, landmark or address, e.g. Koramangala, Bengaluru" autocomplete="off">
          <button type="submit" class="btn">Set location</button>
        </div>
      </form>
      <button id="locate-btn" class="btn btn-accent" type="button">Use my current location</button>
    </div>

    <form id="search-form" class="field" role="search">
      <label for="search-input">Search for anything nearby</label>
      <div class="input-group">
        <input id="search-input" type="text" placeholder="Women's PG, laundry shops, computer institutes…">
        <button type="submit" class="btn">Search</button>
      </div>
    </form>

    <div class="categories" id="categories" role="group" aria-label="Categories"></div>

    <div class="row options">
      <div class="field">
        <label for="radius">Search radius</label>
        <select id="radius">
          <option value="1000">1 km</option>
          <option value="3000" selected>3 km</option>
          <option value="5000">5 km</option>
          <option value="10000">10 km</option>
        </select>
      </div>
      <div class="field">
        <label for="sort">Sort by</label>
        <select id="sort">
          <option value="distance">Nearest distance</option>
          <option value="time">Shortest travel time</option>
        </select>
      </div>
    </div>
  </section>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <main class="layout">
    <section class="results" aria-label="Results">
      <ul id="results" class="result-list"></ul>
    </section>
    <section class="map-panel" aria-label="Map">
      <div id="map"></div>
    </section>
  </main>

  <footer class="site-footer">
    Place and map data from Google. Distances and times are driving estimates from your selected location.
  </footer>

  <script src="js/config.js"></script>
  <script src="js/map.js"></script>
  <script src="js/places.js"></script>
  <script src="js/routes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
